<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1210"/>
      <stop offset="1" stop-color="#14231f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#d9a441" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#d9a441" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="brandmark" cx="0.35" cy="0.35">
      <stop offset="0" stop-color="#e8c37a"/>
      <stop offset="0.5" stop-color="#d9a441"/>
      <stop offset="1" stop-color="#3f5d42"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Hairline borders -->
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#e9e4d8" stroke-width="1" opacity="0.12"/>

  <!-- Top label -->
  <g transform="translate(90, 110)">
    <circle cx="0" cy="0" r="14" fill="url(#brandmark)"/>
    <text x="26" y="6" fill="#e9e4d8" font-family="Georgia, serif" font-size="20" font-weight="500">The Slow Map</text>
    <text x="26" y="26" fill="#6b6a5f" font-family="Courier, monospace" font-size="11" letter-spacing="2">ISSUE №01 · NAUKUCHIATAL</text>
  </g>

  <!-- Right-side eyebrow -->
  <g transform="translate(1110, 120)" text-anchor="end">
    <text fill="#d9a441" font-family="Courier, monospace" font-size="11" letter-spacing="3">A FIELD GUIDE FOR</text>
    <text y="18" fill="#d9a441" font-family="Courier, monospace" font-size="11" letter-spacing="3">QUIET TRAVELLERS</text>
  </g>

  <!-- Main title -->
  <g transform="translate(90, 340)">
    <text fill="#e9e4d8" font-family="Georgia, serif" font-weight="300" font-size="128" letter-spacing="-3">
      Nau<tspan fill="#e8c37a" font-style="italic">kuchia</tspan>tal
    </text>
  </g>

  <!-- Devanagari -->
  <text x="90" y="390" fill="#e8c37a" font-family="Georgia, serif" font-style="italic" font-size="26">नौ · कुचिया · ताल · the lake with nine corners</text>

  <!-- Lake illustration (bottom right) -->
  <g transform="translate(760, 410)" stroke="#d9a441" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Mountain silhouettes -->
    <path d="M 0,60 L 50,20 L 100,45 L 160,10 L 220,40 L 280,5 L 340,35 L 380,60 Z" opacity="0.4"/>
    <!-- Snow caps -->
    <path d="M 50,20 l 4,3 l 4,-2 l 4,3" stroke-width="1"/>
    <path d="M 160,10 l 4,3 l 4,-2 l 4,3" stroke-width="1"/>
    <path d="M 280,5 l 4,3 l 4,-2 l 4,3" stroke-width="1"/>
    <!-- Lake -->
    <path d="M 20,130 L 80,115 L 160,118 L 240,112 L 310,122 L 360,135 L 340,150 L 260,160 L 180,162 L 100,155 L 40,148 Z" stroke-width="1.8" fill="#d9a441" fill-opacity="0.05"/>
    <!-- Boat -->
    <g transform="translate(180, 140)">
      <path d="M -15,0 q 15,10 30,0 l -3,4 q -12,5 -24,0 z" fill="#d9a441" fill-opacity="0.25"/>
      <line x1="0" y1="0" x2="0" y2="-12"/>
      <circle cx="-4" cy="-5" r="1.5"/>
    </g>
    <!-- Ripples -->
    <path d="M 70,140 q 12,-3 24,0" opacity="0.5"/>
    <path d="M 220,148 q 14,-3 28,0" opacity="0.5"/>
    <!-- Tiny sun -->
    <circle cx="300" cy="35" r="14" fill="#e8c37a" fill-opacity="0.4" stroke="none"/>
    <circle cx="300" cy="35" r="14"/>
  </g>

  <!-- Bottom URL -->
  <g transform="translate(90, 560)">
    <text fill="#a8a295" font-family="Georgia, serif" font-style="italic" font-size="18">theslowmap.netlify.app</text>
  </g>

  <!-- Bottom right tagline -->
  <text x="1110" y="566" text-anchor="end" fill="#6b6a5f" font-family="Courier, monospace" font-size="11" letter-spacing="2">VERIFIED · APRIL 2026</text>
</svg>
